[workspace]
members = [
    "crates/*",
    "light-clients/*",
    "ibc-router",
    "ibc-transfer",
    "ibc-gmp",
    "ibc-fast-fill",
    "ibc-voucher-token",
    "gmp-account"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.2.0"
authors = ["Amanda Gonsalves"]
repository = "https://github.com/ipsadev/ipsa-contracts"
rust-version = "1.81.0"

[workspace.dependencies]
soroban-sdk = "26.1.0"
stellar-access = "0.7.2"
stellar-macros = "0.7.2"
stellar-tokens = "0.7.2"
ipsa = { version = "0.1.0", default-features = false }

ipsa-ics23 = { path = "crates/ics23" }
ipsa-smt = { path = "crates/smt" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = 2 }

[workspace.lints.clippy]
use_self = "warn"

[profile.release]
lto = true
opt-level = 3
panic = "unwind"
overflow-checks = true

[profile.contract]
overflow-checks = true
inherits = "release"
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
