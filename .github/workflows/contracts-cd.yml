name: contracts cd

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: contracts-cd-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: build contract wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: setup rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32v1-none

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install stellar cli
        uses: stellar/stellar-cli@v27.0.0
        with:
          version: '27.0.0'

      - name: build contracts
        run: stellar contract build --profile contract

      - name: collect wasm dist
        run: |
          mkdir -p dist
          cp target/wasm32v1-none/contract/*.wasm dist/
          cd dist
          sha256sum *.wasm | tee SHA256SUMS
          ls -la

      - name: upload wasm dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist
          if-no-files-found: error

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [wasm]
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: download wasm dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
