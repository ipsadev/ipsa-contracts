name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "git ref to check out; empty = the ref the run started from"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: setup rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: setup just
        uses: extractions/setup-just@v3

      - name: install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler

      - name: cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-latest-2

      - name: install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: install stellar cli
        uses: stellar/stellar-cli@v27.0.0
        with:
          version: '27.0.0'

      - name: just ci
        run: just ci
