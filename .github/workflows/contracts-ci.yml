name: contracts ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soroban:
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: "."
      targets: wasm32v1-none
      build: stellar contract build --profile contract
      audit: true
