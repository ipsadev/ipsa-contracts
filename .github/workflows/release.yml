name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release (e.g. v0.1.0); leave empty with dry_run to rehearse the branch this runs from"
        type: string
        required: false
        default: ""
      dry_run:
        description: "run the checks, build the wasm, and print the hash table, but deploy and publish nothing"
        type: boolean
        required: false
        default: false
      deploy_router:
        description: "deploy a fresh full set (router, transfer, gmp, both light clients) and wire them, as the first release did; off by default so a release only deploys the light clients whose wasm changed"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks before release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  wasm:
    name: build contract wasm
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: the tag must match the workspace version
        id: gate
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(awk '/^\[workspace.package\]/ {inside = 1; next} /^\[/ {inside = 0} inside && /^version/ {gsub(/[" ]/, ""); sub(/^version=/, ""); print; exit}' Cargo.toml)"
          if [ -z "$TAG" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::a release needs a tag; to rehearse without one, run with dry_run"
              exit 1
            fi
            TAG="v$version"
            echo "::notice::rehearsing $TAG from $GITHUB_REF_NAME, no tag needed"
          elif [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          else
            echo "tag $TAG matches the workspace version $version"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: setup rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32v1-none

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      - name: install stellar cli
        uses: stellar/stellar-cli@v27.0.0
        with:
          version: '27.0.0'

      - name: build contracts
        run: stellar contract build --profile contract

      - name: collect wasm dist
        run: |
          mkdir -p dist
          cp target/wasm32v1-none/contract/*.wasm dist/
          cd dist
          sha256sum *.wasm | tee SHA256SUMS
          ls -la

      - name: upload wasm dist
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist
          if-no-files-found: error

  plan:
    name: hash table (what a release would change)
    runs-on: ubuntu-latest
    needs: [wasm]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download wasm dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: fetch the previous release's checksums
        env:
          TAG: ${{ needs.wasm.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p prev
          : > prev/SHA256SUMS
          prev_tag="$(gh release list --limit 200 --json tagName,createdAt,isDraft \
            --jq "[.[] | select(.isDraft | not) | select(.tagName != \"$TAG\")] | sort_by(.createdAt) | reverse | .[0].tagName // empty")"
          if [ -n "$prev_tag" ] && gh release download "$prev_tag" --pattern SHA256SUMS --dir prev --clobber 2>/dev/null; then
            echo "::notice::comparing against the previous release $prev_tag"
          else
            echo "::notice::no previous release; every contract counts as changed"
          fi

      - name: build the hash table
        env:
          TAG: ${{ needs.wasm.outputs.tag }}
          ROUTER: ${{ vars.ROUTER_ADDRESS }}
        run: |
          set -euo pipefail
          mkdir -p plan
          bash .github/scripts/release-report.sh \
            --current dist/SHA256SUMS \
            --previous prev/SHA256SUMS \
            --tag "$TAG" \
            --network testnet \
            --mode incremental \
            --router "$ROUTER" \
            --md plan/plan.md \
            --json plan/plan.json
          cat plan/plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            plan/plan.md
            plan/plan.json
          if-no-files-found: error

      - name: say what a dry run skipped
        if: ${{ inputs.dry_run == true }}
        run: echo "::notice::dry run - the hash table above is the plan; nothing was deployed or published"

  deploy:
    name: deploy to stellar testnet
    runs-on: ubuntu-latest
    needs: [wasm, plan]
    if: ${{ inputs.dry_run != true }}
    environment: testnet
    timeout-minutes: 30
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    env:
      STELLAR_NETWORK: testnet
      STELLAR_ACCOUNT: ${{ secrets.STELLAR_SIGNING_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: a release is deployed once
        id: existing
        env:
          TAG: ${{ needs.wasm.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists; its contracts were deployed when it was published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout
        if: ${{ steps.existing.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download wasm dist
        if: ${{ steps.existing.outputs.skip != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: download the plan
        if: ${{ steps.existing.outputs.skip != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan

      - name: fetch the previous release's checksums
        if: ${{ steps.existing.outputs.skip != 'true' }}
        env:
          TAG: ${{ needs.wasm.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p prev
          : > prev/SHA256SUMS
          prev_tag="$(gh release list --limit 200 --json tagName,createdAt,isDraft \
            --jq "[.[] | select(.isDraft | not) | select(.tagName != \"$TAG\")] | sort_by(.createdAt) | reverse | .[0].tagName // empty")"
          if [ -n "$prev_tag" ] && gh release download "$prev_tag" --pattern SHA256SUMS --dir prev --clobber 2>/dev/null; then
            echo "::notice::comparing against the previous release $prev_tag"
          fi

      - name: install stellar cli
        if: ${{ steps.existing.outputs.skip != 'true' }}
        uses: stellar/stellar-cli@v27.0.0
        with:
          version: '27.0.0'

      - name: deploy the changed light clients, or a full set
        id: deploy
        if: ${{ steps.existing.outputs.skip != 'true' }}
        env:
          TAG: ${{ needs.wasm.outputs.tag }}
          ROUTER: ${{ vars.ROUTER_ADDRESS }}
          DEPLOY_ROUTER: ${{ inputs.deploy_router }}
          TENDERMINT_CLIENT_ID: ${{ vars.TENDERMINT_CLIENT_ID }}
          SEPOLIA_CLIENT_ID: ${{ vars.SEPOLIA_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$STELLAR_ACCOUNT" ]; then
            echo "::error::the testnet environment has no STELLAR_SIGNING_KEY secret"
            exit 1
          fi

          mkdir -p deployment
          deployed=deployment/deployed.tsv
          : > "$deployed"

          invoke() {
            local id="$1"; shift
            stellar contract invoke --id "$id" -- "$@" >/dev/null
          }

          # read-only call, printing the decoded return value without JSON quotes
          read_call() {
            local id="$1"; shift
            stellar contract invoke --id "$id" --send=no -- "$@" | jq -r .
          }

          # the corridor client id a light client wasm serves
          client_id_for() {
            case "$1" in
              stellar_tendermint_light_client.wasm) printf '%s' "$TENDERMINT_CLIENT_ID" ;;
              stellar_sp1_ethereum_light_client.wasm) printf '%s' "$SEPOLIA_CLIENT_ID" ;;
            esac
          }

          # deploy a new light client and migrate its corridor onto it, in place
          migrate_corridor() {
            local wasm="$1" cid="$2"

            local new_lc
            new_lc="$(stellar contract deploy --wasm "dist/$wasm" -- --router "$ROUTER")"
            echo "::notice::deployed $wasm at $new_lc with router $ROUTER as admin"

            local old_lc
            old_lc="$(read_call "$ROUTER" light_client_address --client_id "$cid")"
            if [ -z "$old_lc" ] || [ "$old_lc" = "null" ]; then
              echo "::error::the router has no light client registered for $cid; cannot migrate"
              exit 1
            fi

            local client_state height consensus_state
            client_state="$(read_call "$old_lc" client_state --client_id "$cid")"
            height="$(read_call "$old_lc" latest_height --client_id "$cid")"
            consensus_state="$(read_call "$old_lc" consensus_state --client_id "$cid" --height "$height")"

            invoke "$ROUTER" migrate_client \
              --client_id "$cid" \
              --light_client_address "$new_lc" \
              --client_state "$client_state" \
              --consensus_state "$consensus_state" \
              --height "$height"
            echo "::notice::migrated $cid from $old_lc onto $new_lc at height $height"

            printf '%s\t%s\t%s\n' "$wasm" "$new_lc" "$cid" >> "$deployed"
          }

          if [ "$DEPLOY_ROUTER" = "true" ]; then
            owner="$(stellar keys address "$STELLAR_ACCOUNT")"

            router="$(stellar contract deploy --wasm dist/stellar_ibc_router.wasm -- --owner "$owner")"
            transfer="$(stellar contract deploy --wasm dist/stellar_ibc_transfer.wasm -- --router "$router" --owner "$owner")"
            gmp="$(stellar contract deploy --wasm dist/stellar_ibc_gmp.wasm -- --owner "$owner" --router "$router")"
            tendermint="$(stellar contract deploy --wasm dist/stellar_tendermint_light_client.wasm -- --router "$router")"
            ethereum="$(stellar contract deploy --wasm dist/stellar_sp1_ethereum_light_client.wasm -- --router "$router")"

            voucher_hash="$(stellar contract upload --wasm dist/stellar_ibc_voucher_token.wasm)"
            account_hash="$(stellar contract upload --wasm dist/ipsa_gmp_account.wasm)"

            invoke "$router" register_client_type --client_type 07-tendermint --light_client_address "$tendermint"
            invoke "$router" register_client_type --client_type sepolia --light_client_address "$ethereum"
            invoke "$router" register_port --port_id transfer --app_address "$transfer"
            invoke "$router" register_port --port_id gmpport --app_address "$gmp"
            invoke "$transfer" set_voucher_wasm --wasm_hash "$voucher_hash"
            invoke "$gmp" set_account_wasm --wasm_hash "$account_hash"

            native="$(stellar contract id asset --asset native)"
            invoke "$transfer" register_asset --denom XLM --address "$native" --voucher false

            {
              printf '%s\t%s\n' stellar_ibc_router.wasm "$router"
              printf '%s\t%s\n' stellar_ibc_transfer.wasm "$transfer"
              printf '%s\t%s\n' stellar_ibc_gmp.wasm "$gmp"
              printf '%s\t%s\n' stellar_tendermint_light_client.wasm "$tendermint"
              printf '%s\t%s\n' stellar_sp1_ethereum_light_client.wasm "$ethereum"
            } > "$deployed"

            bash .github/scripts/release-report.sh \
              --current dist/SHA256SUMS --previous prev/SHA256SUMS \
              --tag "$TAG" --network testnet --mode full --router "$router" \
              --addresses "$deployed" \
              --md deployment/deployments.md --json deployment/deployments.json
          else
            if [ -z "$ROUTER" ]; then
              echo "::error::the testnet environment has no ROUTER_ADDRESS variable; set it to the live router, or run with deploy_router to deploy a fresh set"
              exit 1
            fi

            changed_lcs="$(jq -r '.contracts[] | select(.category == "light-client" and .changed) | .wasm' plan/plan.json)"
            if [ -z "$changed_lcs" ]; then
              echo "::notice::no light client changed since the previous release; nothing to deploy"
            fi

            for wasm in $changed_lcs; do
              cid="$(client_id_for "$wasm")"
              if [ -z "$cid" ]; then
                echo "::error::$wasm changed but its corridor client id is unset; set TENDERMINT_CLIENT_ID / SEPOLIA_CLIENT_ID on the testnet environment"
                exit 1
              fi
            done

            for wasm in $changed_lcs; do
              migrate_corridor "$wasm" "$(client_id_for "$wasm")"
            done

            bash .github/scripts/release-report.sh \
              --current dist/SHA256SUMS --previous prev/SHA256SUMS \
              --tag "$TAG" --network testnet --mode incremental --router "$ROUTER" \
              --addresses "$deployed" \
              --md deployment/deployments.md --json deployment/deployments.json
          fi

          cat deployment/deployments.md >> "$GITHUB_STEP_SUMMARY"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: upload the deployment record
        if: ${{ steps.deploy.outputs.deployed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: |
            deployment/deployments.md
            deployment/deployments.json
          if-no-files-found: error

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [wasm, deploy]
    if: ${{ inputs.dry_run != true }}
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: download wasm dist
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: download the deployment record
        if: ${{ needs.deploy.outputs.deployed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: deployment
          path: deployment

      - name: publish, never replacing what is already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.wasm.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f deployment/deployments.md ]; then
              gh release create "$TAG" --title "$TAG" --generate-notes \
                --notes "$(cat deployment/deployments.md)" \
                dist/* deployment/deployments.json
            else
              gh release create "$TAG" --title "$TAG" --generate-notes dist/*
            fi
            exit 0
          fi

          if gh release download "$TAG" --pattern SHA256SUMS --dir /tmp/published 2>/dev/null; then
            if ! diff -u /tmp/published/SHA256SUMS dist/SHA256SUMS; then
              echo "::error::release $TAG already carries different wasm; a published checksum is never replaced"
              exit 1
            fi
            echo "::notice::release $TAG already carries these exact wasm files; nothing to upload"
          else
            gh release upload "$TAG" dist/*
          fi
