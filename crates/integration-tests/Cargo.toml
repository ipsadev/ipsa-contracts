[package]
name = "integration-tests"
description = "Cross-contract tests for every contract in this workspace, one target per app"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-ibc-router = { path = "../../ibc-router" }
stellar-ibc-transfer = { path = "../../ibc-transfer" }
stellar-ibc-fast-fill = { path = "../../ibc-fast-fill" }
stellar-tendermint-light-client = { path = "../../light-clients/tendermint" }
ics23 = "0.12"
prost = "0.13"
sha2 = "0.10"

[dev-dependencies]
stellar-ibc-gmp = { path = "../../ibc-gmp" }
stellar-ibc-voucher-token = { path = "../../ibc-voucher-token" }
ipsa-gmp-account = { path = "../../gmp-account" }
stellar-sp1-ethereum-light-client = { path = "../../light-clients/sp1-ethereum" }
stellar-sp1-verifier = { path = "../sp1-verifier" }
ipsa = { workspace = true, features = ["types", "gmp", "ics20"] }
ipsa-ics23 = { workspace = true }
ipsa-smt = { workspace = true }

sha3 = "0.10"
serde_json = "1"
tendermint = "0.40"
tendermint-proto = "0.40"
tendermint-testgen = "0.40"
